name: CI

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: healthify
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -phealthify"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      # Each test creates and drops its own healthify_it_<guid> database, so no database is named here.
      HEALTHIFY_IT_MYSQL: server=127.0.0.1;port=3306;user=root;password=healthify

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore healthify-platform.sln

      - name: Build
        run: dotnet build healthify-platform.sln --configuration Release --no-restore

      - name: Test
        run: >-
          dotnet test healthify-platform.sln
          --configuration Release
          --no-build
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults/**/*.trx
          if-no-files-found: warn

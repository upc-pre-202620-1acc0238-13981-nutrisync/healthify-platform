name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore healthify-platform.sln

      - name: Build
        run: dotnet build healthify-platform.sln --configuration Release --no-restore

      - name: Read version from the project file
        id: version
        run: |
          version=$(grep -oPm1 '(?<=<Version>)[^<]+' Healthify.Platform/Healthify.Platform.csproj)
          if [ -z "$version" ]; then
            echo "No <Version> found in Healthify.Platform.csproj" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Healthify Platform v${{ steps.version.outputs.version }}
          generate_release_notes: true
